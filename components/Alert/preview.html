<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alert</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  .demo { padding: var(--space-4); display: grid; gap: var(--space-4); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; }
  .demo { max-width: 560px; }
</style>
</head>
<body>
<div class="demo">
  <div class="rb-alert" role="status">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <div class="rb-alert__content"><p class="rb-alert__title">Scores lock at midnight</p><p class="rb-alert__text">After that, only the host can change Day 3.</p></div>
  </div>
  <div class="rb-alert rb-alert--success" role="status">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg>
    <div class="rb-alert__content"><p class="rb-alert__title">You're on Team Moss</p><p class="rb-alert__text">We'll send the schedule the day before.</p></div>
    <button class="rb-btn rb-btn--quiet rb-btn--icon rb-btn--small rb-alert__close" type="button" aria-label="Dismiss"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="rb-alert rb-alert--error" role="alert">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    <div class="rb-alert__content"><p class="rb-alert__title">Couldn't save the score</p><p class="rb-alert__text">You're offline. We'll keep it on this phone and try again.</p>
      <div class="rb-alert__actions"><button class="rb-btn rb-btn--secondary rb-btn--small" type="button">Try now</button></div></div>
  </div>
</div>
</body>
</html>
