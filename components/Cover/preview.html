<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ribuk</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .leaf { fill:var(--leaf); }
  .soft { fill:var(--leaf-soft); }
  .deep { fill:var(--ink); }
  .rock { fill:var(--leaf); stroke:var(--ink); stroke-width:4; stroke-linejoin:round; }
  .blk { rx:var(--radius-md); }
  .leafy { fill:var(--leaf); }
  .cut { fill:var(--paper); }
  .hl { fill:var(--highlight); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-serif); font-size:120px; line-height:.92; font-weight:800; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="words"><h1 class="name">Ribuk</h1><p class="tag">Bold green, loud serif, round edges.</p></div>
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      leaf 160x256 slab bled off the top (the brand colour, largest) · ink 296x200 bleeding off the right · leaf-soft 128x64 tint above it · the space rock mark (about 45px) as the one satellite on paper · highlight 32 disc as a sticker on the ink field (it vanishes on paper) — about 40% of 960x288
  arrangement one tall leaf slab with an ink field and two satellites, bottoms on one line space-8 above the edge, space-4 gutters
  pattern     literal motif (leaf): 32px lens-shaped leaves from two space-8 arcs, alternating direction like scattered leaves — playful, and it is the brand's own name for its green; 13 leaf leaves on the ink field, 3 cut in paper from the slab
  scales      sides in space-8 / space-4 multiples; gutters space-4; leaf pitch space-8 + space-4 (48px); block corners radius-md, disc rx half of space-8
-->
