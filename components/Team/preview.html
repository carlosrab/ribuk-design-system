<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team badge</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  .demo { padding: var(--space-4); display: grid; gap: var(--space-4); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; }

</style>
</head>
<body>
<div class="demo">
  <div class="row">
    <span class="rb-team rb-team--1"><span class="rb-team__badge" aria-hidden="true">M</span>Team Moss</span>
    <span class="rb-team rb-team--2"><span class="rb-team__badge" aria-hidden="true">I</span>Team Ink</span>
    <span class="rb-team rb-team--3"><span class="rb-team__badge" aria-hidden="true">S</span>Team Sprout</span>
    <span class="rb-team rb-team--4"><span class="rb-team__badge" aria-hidden="true">B</span>Team Bloom</span>
  </div>
  <div class="row">
    <span class="rb-team rb-team--large rb-team--1"><span class="rb-team__badge" aria-hidden="true">M</span></span>
    <span class="rb-team rb-team--large rb-team--2"><span class="rb-team__badge" aria-hidden="true">I</span></span>
    <span class="rb-team rb-team--large rb-team--3"><span class="rb-team__badge" aria-hidden="true">S</span></span>
    <span class="rb-team rb-team--large rb-team--4"><span class="rb-team__badge" aria-hidden="true">B</span></span>
  </div>
</div>
</body>
</html>
