<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  .demo { padding: var(--space-4); display: grid; gap: var(--space-4); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; }

</style>
</head>
<body>
<div class="demo">
  <div class="row">
    <button class="rb-btn rb-btn--primary" type="button">I'm in</button>
    <button class="rb-btn rb-btn--secondary" type="button">Maybe later</button>
    <button class="rb-btn rb-btn--quiet" type="button">See the lineup</button>
  </div>
  <div class="row">
    <button class="rb-btn rb-btn--primary rb-btn--small" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add team</button>
    <button class="rb-btn rb-btn--secondary rb-btn--small" type="button">Invite</button>
    <button class="rb-btn rb-btn--primary" type="button" disabled>Lobby full</button>
  </div>
  <div class="row">
    <button class="rb-btn rb-btn--danger" type="button">Reset scores</button>
    <button class="rb-btn rb-btn--secondary rb-btn--icon" type="button" aria-label="Previous month"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="rb-btn rb-btn--quiet rb-btn--icon" type="button" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
</div>
</body>
</html>
