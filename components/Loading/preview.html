<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  .demo { padding: var(--space-4); display: grid; gap: var(--space-4); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: var(--space-4) var(--space-8); align-items: start; }
  .cap { margin: 0 0 var(--space-2); font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
  .srow { display: flex; align-items: center; gap: var(--space-2); padding: 10px 0; border-bottom: 1px solid var(--line); }
  .box { border: 2px solid var(--line); border-radius: var(--radius-md); }
</style>
</head>
<body>
<div class="demo">
  <div class="grid">
    <div>
      <p class="cap">Spinners and a busy button</p>
      <div class="row">
        <span class="rb-spinner rb-spinner--small" role="status"><span class="rb-sr">Loading</span></span>
        <span class="rb-spinner" role="status"><span class="rb-sr">Loading</span></span>
        <span class="rb-spinner rb-spinner--large" role="status"><span class="rb-sr">Loading</span></span>
        <button class="rb-btn rb-btn--primary" type="button" aria-busy="true"><span class="rb-spinner" aria-hidden="true"></span>Saving…</button>
      </div>
      <p class="cap" style="margin-top: var(--space-4)">Page loader</p>
      <div class="box">
        <div class="rb-loader rb-loader--page" role="status">
          <span class="rb-loader__leaves" aria-hidden="true"><span class="rb-loader__leaf"></span><span class="rb-loader__leaf"></span><span class="rb-loader__leaf"></span></span>
          Loading the scoreboard…
        </div>
      </div>
    </div>
    <div aria-busy="true" aria-label="Loading standings">
      <p class="cap">Skeleton: leaderboard</p>
      <span class="rb-skeleton rb-skeleton--title" style="--w: 60%" aria-hidden="true"></span>
      <div aria-hidden="true">
        <div class="srow"><span class="rb-skeleton rb-skeleton--circle"></span><span class="rb-skeleton rb-skeleton--text" style="--w: 45%"></span><span style="flex:1"></span><span class="rb-skeleton rb-skeleton--text" style="--w: 32px"></span></div>
        <div class="srow"><span class="rb-skeleton rb-skeleton--circle"></span><span class="rb-skeleton rb-skeleton--text" style="--w: 38%"></span><span style="flex:1"></span><span class="rb-skeleton rb-skeleton--text" style="--w: 32px"></span></div>
        <div class="srow"><span class="rb-skeleton rb-skeleton--circle"></span><span class="rb-skeleton rb-skeleton--text" style="--w: 52%"></span><span style="flex:1"></span><span class="rb-skeleton rb-skeleton--text" style="--w: 32px"></span></div>
        <div class="srow"><span class="rb-skeleton rb-skeleton--circle"></span><span class="rb-skeleton rb-skeleton--text" style="--w: 41%"></span><span style="flex:1"></span><span class="rb-skeleton rb-skeleton--text" style="--w: 32px"></span></div>
      </div>
      <p class="cap" style="margin-top: var(--space-4)">Skeleton: card</p>
      <div class="rb-card" aria-hidden="true">
        <span class="rb-skeleton rb-skeleton--text" style="--w: 30%"></span>
        <span class="rb-skeleton rb-skeleton--title" style="--w: 70%"></span>
        <div><span class="rb-skeleton rb-skeleton--text"></span><span class="rb-skeleton rb-skeleton--text" style="--w: 80%"></span></div>
        <span class="rb-skeleton rb-skeleton--pill"></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
