      <tr class="rb-board__you"><td class="rb-board__rank">3</td><td><span class="rb-team rb-team--2"><span class="rb-team__badge" aria-hidden="true">I</span>Team Ink</span></td><td class="rb-board__num rb-board__opt">8</td><td class="rb-board__num rb-board__points">31</td><td class="rb-board__num"><span class="rb-delta rb-delta--same">–<span class="rb-sr">no change</span></span></td></tr>
