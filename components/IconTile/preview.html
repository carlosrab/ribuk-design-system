<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon tile</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  .demo { padding: var(--space-4); display: grid; gap: var(--space-4); max-width: 440px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding-block: var(--space-2); border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .text { display: grid; flex: 1 1 auto; min-width: 0; font-size: 16px; line-height: 24px; }
  .text b { font-weight: 700; }
  .meta { font-size: 14px; line-height: 20px; color: var(--ink-muted); }
  .row[aria-disabled="true"] .text b { color: var(--ink-muted); }
  .panel { display: flex; align-items: center; gap: 12px; padding: var(--space-4); border-radius: var(--radius-md); background: var(--leaf-soft); }
</style>
</head>
<body>
<div class="demo">
  <ul class="list">
    <li class="row">
      <span class="rb-icon-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path><path d="M13 6h8"></path><path d="M13 12h8"></path><path d="M13 18h8"></path></svg></span>
      <span class="text"><b>Before game day</b><span class="meta">Installs, friends lists, a quick test · 2 of 9 done</span></span>
    </li>
    <li class="row">
      <span class="rb-icon-tile rb-icon-tile--open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg></span>
      <span class="text"><b>GeoGuessr Daily</b><span class="meta">Not posted yet</span></span>
    </li>
    <li class="row" aria-disabled="true">
      <span class="rb-icon-tile rb-icon-tile--off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path><path d="M10 16h4"></path><path d="M12 14v4"></path></svg></span>
      <span class="text"><b>Add to calendar</b><span class="meta">Once the date is picked</span></span>
    </li>
    <li class="row">
      <span class="rb-icon-tile rb-icon-tile--ink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></svg></span>
      <span class="text"><b>Host</b><span class="meta">Deadline, tracks, setup, data fixes</span></span>
    </li>
  </ul>
  <div class="panel">
    <span class="rb-icon-tile rb-icon-tile--paper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></svg></span>
    <span class="text"><b>Dinner break</b><span class="meta">30 min</span></span>
  </div>
</div>
</body>
</html>
